name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for manual dry-run build (e.g. v0.3.0-rc1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build Windows Releases
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package archives
        id: build
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $modulePath = $null
          foreach ($line in [IO.File]::ReadAllLines('go.mod')) {
            if ($line -match '^\s*module\s+(\S+)') {
              $modulePath = $Matches[1].Trim('"', "'")
              break
            }
          }
          if ([string]::IsNullOrWhiteSpace($modulePath)) {
            throw 'Could not determine Go module path from go.mod'
          }

          $gitCommit = (git rev-parse --short HEAD).Trim()
          $version = $env:REF_NAME
          if (-not $version -or -not $version.StartsWith('v')) {
            $inputVer = if ($env:INPUT_VERSION) { $env:INPUT_VERSION.Trim() } else { '' }
            if ($inputVer) {
              $version = $inputVer
            } else {
              $version = "dev-$gitCommit"
            }
          }

          $distDir = Join-Path $PWD 'dist'
          if (Test-Path -LiteralPath $distDir) {
            Remove-Item -LiteralPath $distDir -Recurse -Force
          }
          [void][IO.Directory]::CreateDirectory($distDir)

          $commitLdFlag = "-X $modulePath/internal/hub.GitCommit=$gitCommit"
          $checksumLines = New-Object 'System.Collections.Generic.List[string]'

          foreach ($arch in @('amd64', 'arm64')) {
            $stage = Join-Path $distDir "mcp-hub-$version-windows-$arch"
            [void][IO.Directory]::CreateDirectory($stage)

            $env:CGO_ENABLED = '0'
            $env:GOOS = 'windows'
            $env:GOARCH = $arch

            go build -trimpath -ldflags "-H=windowsgui -s -w $commitLdFlag" -o (Join-Path $stage 'mcp-hub.exe') ./cmd/mcp-hub
            if ($LASTEXITCODE -ne 0) { throw "go build mcp-hub ($arch) failed" }

            go build -trimpath -ldflags "-s -w $commitLdFlag" -o (Join-Path $stage 'mcp-hub-ctl.exe') ./cmd/mcp-hub-ctl
            if ($LASTEXITCODE -ne 0) { throw "go build mcp-hub-ctl ($arch) failed" }

            foreach ($doc in @('install-local.ps1', 'config.example.json', 'LICENSE', 'README.md', 'README.zh-CN.md', 'SECURITY.md')) {
              if (Test-Path -LiteralPath $doc -PathType Leaf) {
                Copy-Item -LiteralPath $doc -Destination $stage
              }
            }

            $zipName = "mcp-hub-$version-windows-$arch.zip"
            $zipPath = Join-Path $distDir $zipName
            Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipPath -CompressionLevel Optimal
            $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksumLines.Add("$hash  $zipName")
          }

          [IO.File]::WriteAllLines((Join-Path $distDir 'SHA256SUMS.txt'), $checksumLines, (New-Object Text.UTF8Encoding($false)))
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload workflow artifacts (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mcp-hub-${{ steps.build.outputs.version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
