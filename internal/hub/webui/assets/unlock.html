<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>McpHub — Unlock</title>
  <link rel="icon" type="image/svg+xml" href="/ui/assets/favicon.svg">
  <link rel="stylesheet" href="/ui/assets/app.css">
  <script defer src="/ui/assets/unlock.js"></script>
</head>
<body class="unlock-body">
  <div class="unlock-corner">
    <button type="button" class="icon-btn" id="btn-theme" title="Toggle theme" aria-label="Toggle color theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2"/>
        <path d="M12 20v2"/>
        <path d="m4.93 4.93 1.41 1.41"/>
        <path d="m17.66 17.66 1.41 1.41"/>
        <path d="M2 12h2"/>
        <path d="M20 12h2"/>
        <path d="m6.34 17.66-1.41 1.41"/>
        <path d="m19.07 4.93-1.41 1.41"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
    </button>
  </div>

  <main class="unlock-card">
    <div class="unlock-brand">
      <svg class="brand-logo" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="8.4" x2="12" y2="6"/>
          <line x1="15.1" y1="13.8" x2="17.2" y2="15"/>
          <line x1="8.9" y1="13.8" x2="6.8" y2="15"/>
          <circle cx="12" cy="12" r="3.4"/>
        </g>
        <circle cx="12" cy="12" r="1.35" class="brand-core"/>
        <circle cx="12" cy="4.4" r="1.9" fill="currentColor"/>
        <circle cx="18.6" cy="15.8" r="1.9" fill="currentColor"/>
        <circle cx="5.4" cy="15.8" r="1.9" fill="currentColor"/>
      </svg>
      <h1 class="unlock-title">McpHub</h1>
    </div>

    {{if .Expired}}
    <div class="unlock-alert alert-warn" role="alert">
      Bootstrap link expired or already used.
    </div>
    {{end}}

    <form class="unlock-form" id="unlock-form">
      <label class="field-label" for="control-token">Control Token</label>
      <input type="password" id="control-token" name="token" class="text-input mono" autocomplete="current-password" required autofocus>
      <div class="unlock-alert alert-error" id="unlock-error" role="alert" hidden></div>
      <button type="submit" class="btn btn-primary btn-full" id="btn-unlock">Unlock</button>
    </form>

    <div class="unlock-divider"></div>

    <div class="unlock-alt">
      <div class="unlock-alt-row">
        <span class="unlock-alt-key">Tray</span>
        <span class="mono unlock-alt-val">Open Web Dashboard</span>
      </div>
      <div class="unlock-alt-row">
        <span class="unlock-alt-key">CLI</span>
        <code class="mono unlock-alt-val">mcp-hub-ctl ui</code>
      </div>
    </div>
  </main>
</body>
</html>
